name: Pause (archive data, hide page)

on:
  workflow_dispatch:

permissions:
  contents: write             # push the archive branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: calendar-${{ github.run_id }}
          restore-keys: calendar-
          fail-on-cache-miss: true
      # Actions caches expire after 7 idle days, so keep the data and the last page in a branch.
      - name: Archive to branch "archive"
        run: |
          jpfly -c config.toml --no-fetch -o /tmp/site
          mkdir /tmp/archive && cp -r .cache /tmp/archive/cache && cp -r /tmp/site /tmp/archive/site
          cd /tmp/archive
          git init -q -b archive
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -qm "Archive of the search cache and page"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" archive
      - name: Stub page
        run: |
          mkdir stub
          printf '<!doctype html><meta charset="utf-8"><title>Paused</title><p style="font:16px sans-serif;margin:2em">Страница на паузе.</p>' > stub/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stub
      - id: deploy
        uses: actions/deploy-pages@v4
