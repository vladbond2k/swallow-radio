name: Search flights

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  schedule:
    - cron: "17 */4 * * *"    # every 4 hours; each run continues where Google stopped the previous one

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: calendar-${{ github.run_id }}
          restore-keys: calendar-
      - name: Search
        run: jpfly -c config.toml -o site
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: calendar-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
