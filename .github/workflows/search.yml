name: Search flights

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  schedule:
    - cron: "17 */2 * * *"    # every 2 hours; each run continues where Google stopped the previous one

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WG_CONF: ${{ secrets.WIREGUARD_CONF }}   # optional: Proton/any WireGuard config, so Google sees a VPN IP
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: calendar-${{ github.run_id }}
          restore-keys: calendar-
      - name: Connect VPN
        if: env.WG_CONF != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools resolvconf >/dev/null
          printf '%s\n' "$WG_CONF" | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo wg-quick up wg0
          echo "public IP now: $(curl -s --max-time 10 https://api.ipify.org)"
      - name: Search
        run: jpfly -c config.toml -o site
      - name: Disconnect VPN
        if: always() && env.WG_CONF != ''
        run: sudo wg-quick down wg0 || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: calendar-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
