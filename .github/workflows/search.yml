name: Search flights

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  schedule:
    - cron: "7,37 * * * *"    # every 30 min; each run continues where Google stopped the previous one

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Google limits requests per IP, so 5 runners split the work, each through its own VPN server
  # (secret named in `wg`; if that secret is missing the runner just uses its own GitHub IP).
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, wg: WIREGUARD_CONF }
          - { shard: 2, wg: WIREGUARD_CONF_1 }
          # Google refused every request from the Proton servers in CONF_2..4, so these use the runner's IP.
          # Put a secret name back here to try a new server.
          - { shard: 3, wg: NONE }
          - { shard: 4, wg: NONE }
          - { shard: 5, wg: NONE }
    env:
      WG_CONF: ${{ secrets[matrix.wg] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: calendar-${{ github.run_id }}
          restore-keys: calendar-
      - name: Connect VPN
        if: env.WG_CONF != ''
        continue-on-error: true      # a broken config shouldn't kill the run; this runner then uses its own IP
        timeout-minutes: 3
        run: .github/scripts/vpn-up.sh
      - name: Search
        run: |
          # if the VPN came up half-broken, drop it and use the runner's own connection
          curl -s --max-time 10 -o /dev/null https://www.google.com || sudo wg-quick down wg0 || true
          jpfly -c config.toml --shard ${{ matrix.shard }}/5 -o /tmp/unused
      - name: Disconnect VPN
        if: always() && env.WG_CONF != ''
        run: sudo wg-quick down wg0 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-shard-${{ matrix.shard }}
          path: .cache/calendar
          retention-days: 1
          if-no-files-found: ignore

  publish:
    needs: search
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: calendar-${{ github.run_id }}
          restore-keys: calendar-
      - uses: actions/download-artifact@v4
        with:
          pattern: calendar-shard-*
          path: shards
      - name: Merge and build page
        run: jpfly -c config.toml --no-fetch --merge shards/* -o site
      - uses: actions/cache/save@v4
        with:
          path: .cache
          key: calendar-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
