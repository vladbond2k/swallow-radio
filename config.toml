# Search settings. Edit and rerun (locally: `jpfly`; online: Actions -> Search flights -> Run workflow).

currency = "PLN"

[trip]
depart_from = "2027-01-15"   # any day in this window is fine to leave
depart_to   = "2027-04-30"   # (Google only knows prices ~10 months ahead)
min_days = 14                # trip length in days
max_days = 21
max_stops = 2                # 0 = direct only, 1, 2, or -1 = any

# Airports you can fly from (all reachable by car from Wroclaw). Prices are tickets only.
[home]
airports = ["WRO", "KTW", "POZ", "KRK", "PRG", "WAW", "BER", "VIE"]

# Any of these is fine to land in / fly back from.
[japan]
airports = ["HND", "NRT", "KIX", "NGO", "FUK", "CTS", "OKA"]
