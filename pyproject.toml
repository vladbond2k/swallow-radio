[project]
name = "jpfly"
version = "0.1.0"
description = "Brute-force cheap flight finder: home -> Japan -> home, with open-jaw and self-transfer via hubs"
requires-python = ">=3.11"
dependencies = ["fast-flights>=3.1,<4"]

[project.scripts]
jpfly = "jpfly.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jpfly"]
