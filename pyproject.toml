[project]
name = "jpfly"
version = "0.2.0"
description = "Cheapest dates for a round trip to Japan, from Google Flights' price calendar"
requires-python = ">=3.10"
dependencies = ["flights>=0.9,<1"]

[project.scripts]
jpfly = "jpfly.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jpfly"]
