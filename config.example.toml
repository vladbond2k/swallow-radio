# Search settings. Edit and rerun (locally: `jpfly`; online: Actions -> Search flights -> Run workflow).

currency = "PLN"
market = "PL"            # country whose prices Google shows (independent of VPN location)

[trip]
depart_from = "2027-01-15"   # any day in this window is fine to leave
depart_to   = "2027-06-30"   # (Google only knows prices ~10 months ahead)
min_days = 14                # trip length in days
max_days = 21
max_stops = 2                # 0 = direct only, 1, 2, or -1 = any
max_layover_hours = 6        # longest connection you accept; 0 = no limit (cheapest dates get re-checked with it)
max_travel_hours = 0         # longest one-way journey incl. connections; 0 = no limit (e.g. 20)

# Airports you can fly from (all reachable by car from Wroclaw). Prices are tickets only.
[home]
airports = ["WRO", "KTW", "POZ", "KRK", "PRG", "WAW", "BER", "VIE"]

# Any of these is fine to land in / fly back from. Every airport here multiplies the number of
# requests to Google; Tokyo (HND, NRT) and Osaka (KIX) are where the cheap fares from Europe go.
[japan]
airports = ["HND", "NRT", "KIX"]

[google]
delay = 3                    # seconds between requests
backoff = [60]               # if Google refuses: wait this long and retry; then stop until the next run
cache_hours = 30             # prices older than this are dropped and asked again
verify_top = 450             # how many of the cheapest calendar dates to re-check with the layover limit
verify_per_run = 8           # re-checks per runner per run; the rest of Google's quota fills the calendar
